services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/fatigue_nudging.db
      EXPORT_DIR: /data/exports
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - research-data:/data
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  research-data:
